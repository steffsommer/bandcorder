name: main

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-desktop-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"

      - name: Build
        run: devbox run -- make -C server build-windows

      - name: Run tests
        run: devbox run -- make -C server tests

      - name: Upload Bandcorder.exe artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: server/build/bin/Bandcorder.exe

  test-mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.0
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk

      - name: Upload Bandcorder.apk artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app
          path: app/build/app/outputs/flutter-apk/app-release.apk

  release:
    if: github.ref_type == 'tag'
    needs: [test-desktop-app, test-mobile-app]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename APK
        run: mv mobile-app/app-release.apk mobile-app/Bandcorder.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-app/Bandcorder.exe
            mobile-app/Bandcorder.apk
